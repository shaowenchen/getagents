apiVersion: apps/v1
kind: Deployment
metadata:
  name: getagents
  namespace: ops-system
  labels:
    app: getagents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: getagents
  template:
    metadata:
      labels:
        app: getagents
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: getagents
          image: docker.io/shaowenchen/getagents:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: URI_PREFIX
              value: "/getagents"
            - name: ACCESS_URL
              value: "https://example.com/getagents"
            - name: SESSION_SECRET
              value: "getagents-session-secret-change-me"
            - name: LOG_LEVEL
              value: "info"
            - name: SQL_DSN
              value: ""
            - name: MAX_UPLOAD_MB
              value: "100"
            - name: ADMIN_API_KEY
              value: "user-admin-api-key-change-me"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
